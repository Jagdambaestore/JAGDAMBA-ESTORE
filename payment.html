<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jagdamba E-Store - UPI Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    .header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .payment-box {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    .qr-box {
      width: 300px;
      height: 300px;
      margin: 20px auto;
      padding: 10px;
      background: white;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img {
      width: 270px;
      height: 270px;
    }

    .upi-box {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
      font-size: 17px;
      font-weight: bold;
      word-break: break-all;
    }

    button,
    .pay-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-button {
      background: white;
      border: 1px solid #172033;
      margin-bottom: 12px;
    }

    .pay-button {
      display: block;
      background: #172033;
      color: white;
      text-decoration: none;
      padding: 15px 0;
    }

    .cod {
      margin-top: 25px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      font-weight: bold;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>JAGDAMBA E-STORE</h1>
    <div>Google Pay / UPI Payment</div>
  </div>

  <div class="container">

    <div class="payment-box">

      <h2>📱 Scan & Pay</h2>

      <p>
        Google Pay, PhonePe, Paytm या किसी भी UPI App
        से QR Code scan करें।
      </p>

      <!-- QR CODE -->
      <div class="qr-box">
        <div id="qrcode"></div>
      </div>

      <div class="upi-box">
        anshul88266@okhdfcbank
      </div>

      <button
        class="copy-button"
        onclick="copyUPI()">
        📋 COPY UPI ID
      </button>

      <a
        class="pay-button"
        href="upi://pay?pa=anshul88266@okhdfcbank&pn=JAGDAMBA%20E-STORE&cu=INR">
        📲 PAY USING UPI APP
      </a>

      <div class="note">
        Payment करने के बाद अपना order confirmation
        पूरा करें।
      </div>

      <div class="cod">
        💵 Cash on Delivery भी Available है
      </div>

      <a
        class="back"
        href="index.html">
        ← Back to Store
      </a>

    </div>

  </div>

  <!-- QR CODE LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>

    const upiLink =
      "upi://pay?pa=anshul88266@okhdfcbank" +
      "&pn=JAGDAMBA%20E-STORE" +
      "&cu=INR";

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: upiLink,
        width: 270,
        height: 270,
        correctLevel: QRCode.CorrectLevel.M
      }
    );

    function copyUPI() {

      const upi = "anshul88266@okhdfcbank";

      navigator.clipboard.writeText(upi)
        .then(function() {

          alert("UPI ID copied successfully!");

        })
        .catch(function() {

          alert("UPI ID: " + upi);

        });

    }

  </script>

</body>
</html>
