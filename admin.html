```html
<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>
    Jagdamba E-Store — Admin
  </title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="affiliate.css">

</head>


<body>


<header class="topbar">

  <div class="brand">
    JAGDAMBA
    <span>ADMIN PANEL</span>
  </div>

  <nav>

    <a href="index.html">
      Store
    </a>

    <button
      id="logout"
      class="cart-btn">
      Logout
    </button>

  </nav>

</header>



<main class="section">


<!-- ================= LOGIN ================= -->

<div
  id="loginBox"
  class="card"
  style="max-width:480px;margin:auto">

  <div class="card-body">

    <p class="eyebrow">
      SECURE ADMIN
    </p>

    <h2>
      Admin Login
    </h2>


    <input
      id="email"
      class="search"
      style="width:100%;margin:6px 0"
      type="email"
      placeholder="Admin email"
    >


    <input
      id="password"
      class="search"
      style="width:100%;margin:6px 0"
      type="password"
      placeholder="Password"
    >


    <button
      id="login"
      class="primary"
      style="margin-top:10px">

      Login

    </button>


    <p id="loginMsg"></p>

  </div>

</div>



<!-- ================= ADMIN PANEL ================= -->

<div id="panel" class="hidden">


  <div class="section-head">

    <div>

      <p class="eyebrow">
        STORE MANAGEMENT
      </p>

      <h2>
        Products
      </h2>

    </div>


    <button
      id="newProduct"
      class="primary">

      + Add Product

    </button>

  </div>



<!-- ================= PRODUCT FORM ================= -->

<div
  id="formBox"
  class="card hidden"
  style="margin:25px 0">

  <div class="card-body">


    <h3 id="formTitle">
      Add Product
    </h3>


    <input
      type="hidden"
      id="pid"
    >



    <!-- PRODUCT NAME -->

    <label>
      Product Name
    </label>

    <input
      id="pname"
      class="search admin-field"
      placeholder="Product name"
    >



    <!-- DESCRIPTION -->

    <label>
      Description
    </label>

    <textarea
      id="pdesc"
      class="search admin-field"
      style="height:100px"
      placeholder="Description"></textarea>



    <!-- IMAGE -->

    <label>
      Product Image URL
    </label>

    <input
      id="pimage"
      class="search admin-field"
      placeholder="https://..."
    >



    <!-- CATEGORY -->

    <label>
      Category
    </label>

    <select
      id="pcat"
      class="search admin-field">
    </select>



    <!-- PRODUCT TYPE -->

    <label>
      Product Type
    </label>

    <select
      id="ptype"
      class="search admin-field">

      <option value="normal">
        Normal / Own Store Product
      </option>

      <option value="affiliate">
        Affiliate Product
      </option>

    </select>



    <!-- AFFILIATE LINKS -->

    <div
      id="affiliateFields"
      class="affiliate-admin-box">

      <h4>
        Marketplace Affiliate Links
      </h4>

      <p class="muted">
        Yahan sirf apne approved
        affiliate/deep links paste karein.
      </p>



      <!-- AMAZON -->

      <label>
        Amazon Affiliate Link
      </label>

      <input
        id="amazonUrl"
        class="search admin-field"
        placeholder="https://www.amazon.in/...tag=YOURTAG-21"
      >



      <!-- FLIPKART -->

      <label>
        Flipkart Affiliate / Deep Link
      </label>

      <input
        id="flipkartUrl"
        class="search admin-field"
        placeholder="https://www.flipkart.com/..."
      >



      <!-- MEESHO -->

      <label>
        Meesho Affiliate Link
      </label>

      <input
        id="meeshoUrl"
        class="search admin-field"
        placeholder="https://..."
      >

    </div>



    <!-- PRICE -->

    <label>
      Price
    </label>

    <input
      id="pprice"
      class="search admin-field"
      type="number"
      step="0.01"
      placeholder="Price"
    >



    <!-- DISCOUNT -->

    <label>
      Discount Price (optional)
    </label>

    <input
      id="pdiscount"
      class="search admin-field"
      type="number"
      step="0.01"
      placeholder="Discount price"
    >



    <!-- DELIVERY -->

    <label>
      Delivery Charge
    </label>

    <input
      id="pdelivery"
      class="search admin-field"
      type="number"
      step="0.01"
      value="0"
    >



    <!-- STOCK -->

    <label>
      Stock
    </label>

    <input
      id="pstock"
      class="search admin-field"
      type="number"
      value="0"
    >


    <br><br>


    <button
      id="save"
      class="primary">

      Save Product

    </button>


    <button
      id="cancel"
      class="chip">

      Cancel

    </button>


    <p id="msg"></p>


  </div>

</div>



<!-- PRODUCT LIST -->

<div
  id="adminProducts"
  class="grid">
</div>


</div>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ADMIN JAVASCRIPT -->

<script src="admin.js"></script>


</body>

</html>
```
